[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iplquant"
version = "0.1.0"
description = "IPL win-probability models plus an odds-trading engine (value, green-up hedging, arbitrage) with a walk-forward backtester"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
dev = ["pytest>=8"]

[project.scripts]
ipl = "iplquant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iplquant"
version = "0.1.0"
description = "In-play win-probability models for franchise T20 leagues, an odds-trading engine and a browser bot for exchange sites"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
app = ["streamlit>=1.35"]
browser = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
ipl = "iplquant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iplquant = ["exchange/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
